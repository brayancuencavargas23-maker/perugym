<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanGym - Visor 3D Profesional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0a0f1d;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        .glass-badge {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="text-gray-100 flex flex-col items-center justify-between min-h-screen p-6 relative">

    <div id="canvas-container"></div>

    <!-- Elemento flotante minimalista informativo superior -->
    <div class="relative z-10 w-full max-w-md flex justify-center pointer-events-none">
        <div class="glass-badge px-5 py-2.5 rounded-full flex items-center space-x-3 text-xs md:text-sm text-gray-300">
            <i class="fa-solid fa-dumbbell text-blue-500 animate-bounce"></i>
            <span class="font-medium tracking-wide">Visor Profesional de Equipamiento 3D</span>
        </div>
    </div>

    <!-- Indicador inferior de interacción -->
    <div class="relative z-10 w-full max-w-sm flex justify-center pointer-events-none mb-4">
        <div class="glass-badge px-6 py-3 rounded-full text-center text-xs text-gray-300 flex items-center space-x-2 shadow-2xl">
            <i class="fa-solid fa-arrows-spin text-blue-400 text-sm animate-pulse"></i>
            <span>Haz clic y arrastra para rotar la mancuerna en 360°</span>
        </div>
    </div>

    <script>
        let scene, camera, renderer, particles, dumbbellGroup;
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let autoRotate = true;

        function createHighDetailNoiseTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const context = canvas.getContext('2d');
            const imgData = context.createImageData(512, 512);
            for (let i = 0; i < imgData.data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 50;
                const val = Math.min(255, Math.max(0, 120 + noise));
                imgData.data[i] = val;
                imgData.data[i+1] = val;
                imgData.data[i+2] = val;
                imgData.data[i+3] = 255;
            }
            context.putImageData(imgData, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(6, 2);
            return texture;
        }

        function createKnurlingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const context = canvas.getContext('2d');
            context.fillStyle = '#777';
            context.fillRect(0, 0, 256, 256);
            context.strokeStyle = '#fff';
            context.lineWidth = 3;
            for(let i = -256; i < 512; i += 12) {
                context.beginPath(); context.moveTo(i, 0); context.lineTo(i + 256, 256); context.stroke();
                context.beginPath(); context.moveTo(i, 256); context.lineTo(i + 256, 0); context.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(16, 3);
            return texture;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.0012);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.z = 900;
            camera.position.y = 0;

            // Iluminación de estudio profesional de 3 puntos
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
            keyLight.position.set(400, 500, 600);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x3b82f6, 2.0);
            fillLight.position.set(-500, -300, 400);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0x60a5fa, 2.2);
            rimLight.position.set(0, 600, -500);
            scene.add(rimLight);

            dumbbellGroup = new THREE.Group();

            const noiseTex = createHighDetailNoiseTexture();
            const knurlTex = createKnurlingTexture();

            const chromeMaterial = new THREE.MeshStandardMaterial({
                color: 0xf2f5f9,
                metalness: 0.99,
                roughness: 0.1,
                envMapIntensity: 1.8
            });

            const gripMaterial = new THREE.MeshStandardMaterial({
                color: 0xb0b8c4,
                metalness: 0.9,
                roughness: 0.35,
                bumpMap: knurlTex,
                bumpScale: 0.04
            });

            const ironMaterial = new THREE.MeshStandardMaterial({
                color: 0x141824,
                metalness: 0.45,
                roughness: 0.72,
                bumpMap: noiseTex,
                bumpScale: 1.5
            });

            const barLength = 320;
            const barRadius = 8.5;
            const barGeo = new THREE.CylinderGeometry(barRadius, barRadius, barLength, 48);
            const bar = new THREE.Mesh(barGeo, chromeMaterial);
            bar.rotation.z = Math.PI / 2;
            dumbbellGroup.add(bar);

            const gripGeo = new THREE.CylinderGeometry(barRadius + 0.6, barRadius + 0.6, 120, 48);
            const grip = new THREE.Mesh(gripGeo, gripMaterial);
            grip.rotation.z = Math.PI / 2;
            dumbbellGroup.add(grip);

            function createWeightPlate(radius, thickness, distanceX) {
                const plateGeo = new THREE.CylinderGeometry(radius, radius, thickness, 64);
                
                const plateR = new THREE.Mesh(plateGeo, ironMaterial);
                plateR.rotation.z = Math.PI / 2;
                plateR.position.x = distanceX;
                dumbbellGroup.add(plateR);
                
                const plateL = new THREE.Mesh(plateGeo, ironMaterial);
                plateL.rotation.z = Math.PI / 2;
                plateL.position.x = -distanceX;
                dumbbellGroup.add(plateL);

                const edgeGeo = new THREE.TorusGeometry(radius, thickness / 2, 24, 64);
                const edgeR = new THREE.Mesh(edgeGeo, ironMaterial);
                edgeR.rotation.y = Math.PI / 2;
                edgeR.position.x = distanceX;
                dumbbellGroup.add(edgeR);

                const edgeL = new THREE.Mesh(edgeGeo, ironMaterial);
                edgeL.rotation.y = Math.PI / 2;
                edgeL.position.x = -distanceX;
                dumbbellGroup.add(edgeL);
            }

            const collarGeo = new THREE.CylinderGeometry(17, 17, 14, 32);
            const collarR = new THREE.Mesh(collarGeo, chromeMaterial);
            collarR.rotation.z = Math.PI / 2; collarR.position.x = 70;
            dumbbellGroup.add(collarR);
            const collarL = new THREE.Mesh(collarGeo, chromeMaterial);
            collarL.rotation.z = Math.PI / 2; collarL.position.x = -70;
            dumbbellGroup.add(collarL);

            createWeightPlate(78, 18, 95);
            createWeightPlate(60, 15, 116);
            createWeightPlate(44, 13, 132);
            
            const endCapGeo = new THREE.CylinderGeometry(12, 12, 6, 32);
            const endCapR = new THREE.Mesh(endCapGeo, chromeMaterial);
            endCapR.rotation.z = Math.PI / 2; endCapR.position.x = barLength / 2;
            dumbbellGroup.add(endCapR);
            const endCapL = new THREE.Mesh(endCapGeo, chromeMaterial);
            endCapL.rotation.z = Math.PI / 2; endCapL.position.x = -barLength / 2;
            dumbbellGroup.add(endCapL);

            // Centrar perfectamente en pantalla
            dumbbellGroup.rotation.x = Math.PI / 6;
            dumbbellGroup.rotation.y = Math.PI / 4;
            dumbbellGroup.position.y = 0;

            scene.add(dumbbellGroup);

            // Partículas ambientales estéticas
            const partGeo = new THREE.BufferGeometry();
            const particleCount = 400;
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                positions[i*3] = (Math.random() * 2000) - 1000;
                positions[i*3+1] = (Math.random() * 2000) - 1000;
                positions[i*3+2] = (Math.random() * 2000) - 1000;
            }
            partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const partMat = new THREE.PointsMaterial({
                size: 2.5, color: 0x3b82f6, transparent: true, opacity: 0.3
            });
            particles = new THREE.Points(partGeo, partMat);
            scene.add(particles);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            container.addEventListener('mousedown', onPointerDown, false);
            document.addEventListener('mousemove', onPointerMove, false);
            document.addEventListener('mouseup', onPointerUp, false);
            
            container.addEventListener('touchstart', onPointerDown, {passive: false});
            document.addEventListener('touchmove', onPointerMove, {passive: false});
            document.addEventListener('touchend', onPointerUp, false);
            
            window.addEventListener('resize', onWindowResize, false);
        }

        function onPointerDown(e) {
            isDragging = true;
            autoRotate = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerMove(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            if (!isDragging) {
                mouseX = (clientX - windowHalfX) * 0.03;
                mouseY = (clientY - windowHalfY) * 0.03;
                return;
            }

            const deltaMove = {
                x: clientX - previousMousePosition.x,
                y: clientY - previousMousePosition.y
            };

            if(dumbbellGroup) {
                dumbbellGroup.rotation.y += deltaMove.x * 0.01;
                dumbbellGroup.rotation.x += deltaMove.y * 0.01;
            }

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp(e) {
            isDragging = false;
            setTimeout(() => { if(!isDragging) autoRotate = true; }, 3500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && dumbbellGroup) {
                dumbbellGroup.rotation.y += 0.003;
            }

            if(particles) particles.rotation.y += 0.0004;

            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.lookAt(scene.position);

            if(renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        window.onload = function() {
            init3D();
            animate();
        };
    </script>
</body>
</html>
